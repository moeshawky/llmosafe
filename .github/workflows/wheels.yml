# ═══════════════════════════════════════════════════════════════════════════════
# MASTER: Unified Python Wheel Build + Publish (ix / sniper / llmosafe)
# ═══════════════════════════════════════════════════════════════════════════════
# This is the CANONICAL workflow. ix and sniper use identical copies.
# llmosafe DIVERGES deliberately — do NOT "restore" uniformity here:
#   ix / sniper : cp310-abi3 wheels (pyo3 abi3-py310)
#   llmosafe    : cp38-abi3 wheels  (pyo3 abi3-py38, valid CPython 3.8–3.13+)
# llmosafe previously built cp312-cp312 (version-specific) wheels, which left
# CPython 3.13 users with NO installable artifact and no sdist fallback.
# That defect and its next-release remediation are tracked in
# PROJECT-ROADMAP.md under the "Python wheel ABI" gate.
#
# Canonical source: /workspace/.github/workflows/wheels.yml
# Local build:      /workspace/.github/scripts/build-wheels.sh
# Reference:        /workspace/PUBLISHING.md
#
# To adopt for a new project:
#   1. Copy this file to .github/workflows/wheels.yml
#   2. Change PROJECT below
#   3. Set up Trusted Publishing on pypi.org and test.pypi.org for the repo
#   4. Add a "pypi" environment in repo Settings > Environments
# ═══════════════════════════════════════════════════════════════════════════════

name: Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: >-
          Also publish to PRODUCTION PyPI on a manual dispatch. Leave false for
          a dry run (TestPyPI only). Only set true when appending NEW wheel
          filenames to an EXISTING version (Path A hotfix); releases must still
          go through a v* tag push.
        type: boolean
        default: false

# ── Project identity (ONLY line that differs between projects) ──────────────
env:
  PROJECT: llmosafe                          # ← CHANGE THIS: ix | sniper | llmosafe
  # NOTE: llmosafe builds abi3 wheels, so this is NOT part of the wheel tag
  # (maturin emits cp38-abi3 regardless of -i). It only selects the runner's
  # interpreter. Safe to leave at 3.12 even though the wheel serves 3.8–3.13+.

# ── Concurrency: cancel in-progress on re-push ──────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Linux wheels — all projects
  # ═══════════════════════════════════════════════════════════════════════════
  build-linux:
    name: linux (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
            pre-build: |
              yum install -y openssl-devel || true
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
            pre-build: |
              yum install -y openssl-devel || true

    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.PROJECT }}-py
          # abi3-py38 in Cargo.toml makes maturin emit cp38-abi3-* regardless
          # of -i; the interpreter arg is retained for template parity.
          args: --release --out dist -i python3.12
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: ${{ matrix.pre-build }}

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: ${{ env.PROJECT }}-py/dist/

  # ═══════════════════════════════════════════════════════════════════════════
  # Publish to TestPyPI — on every tag push and manual dispatch
  # ═══════════════════════════════════════════════════════════════════════════
  publish-testpypi:
    name: Publish → TestPyPI
    needs: [build-linux]
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
          attestations: false

  # ═══════════════════════════════════════════════════════════════════════════
  # Publish to PyPI — on tag push only (not manual dispatch by default)
  # ═══════════════════════════════════════════════════════════════════════════
  publish-pypi:
    name: Publish → PyPI
    needs: [build-linux]
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.publish_pypi == true)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ env.PROJECT == 'ix' && 'moeix' || env.PROJECT == 'sniper' && 'moesniper' || 'llmosafe' }}
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
          attestations: false
